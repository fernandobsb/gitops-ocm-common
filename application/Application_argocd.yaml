apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: open-cluster-management-argocd
spec:
  project: gitops-ocm-common
  destination:
    name: in-cluster
    namespace: argo-cd
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: "5.52.2"
    helm:
      releaseName: argo-cd
      values: |
        installCRDs: true
        configs:
          params:
            server.insecure: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
